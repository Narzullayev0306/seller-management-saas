name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  POSTGRES_USER: seller
  POSTGRES_PASSWORD: seller_dev_password
  POSTGRES_DB: seller_management

jobs:
  backend:
    name: Backend (ruff + pip-audit + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seller
          POSTGRES_PASSWORD: seller_dev_password
          POSTGRES_DB: seller_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seller"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Ruff
        run: ruff check app tests

      - name: Dependency vulnerability scan
        run: pip-audit

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://seller:seller_dev_password@localhost:5432/seller_management
        run: pytest -q

  frontend:
    name: Frontend (tsc + eslint + npm audit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t seller-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t seller-frontend:ci ./frontend